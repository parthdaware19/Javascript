<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart Total Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

.container{
    width:500px;
    margin:30px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
}

input{
    width:95%;
    padding:10px;
    margin:8px 0;
}

button{
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:darkgreen;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table,th,td{
    border:1px solid black;
}

th,td{
    padding:8px;
    text-align:center;
}

.summary{
    margin-top:20px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h2>Shopping Cart</h2>

<input type="text" id="name" placeholder="Enter Product Name">
<input type="number" id="price" placeholder="Enter Price">
<input type="number" id="quantity" placeholder="Enter Quantity">

<button onclick="addItem()">Add to Cart</button>

<table>
<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>

<tbody id="cartBody"></tbody>

</table>

<div class="summary">
<p><b>Total Quantity:</b> <span id="qty">0</span></p>
<p><b>Total Price:</b> ₹<span id="total">0</span></p>
<p><b>Discount:</b> ₹<span id="discount">0</span></p>
<h3>Final Amount: ₹<span id="final">0</span></h3>
</div>

</div>

<script>

// Array of Objects
let cart=[];

function addItem(){

    let name=document.getElementById("name").value;
    let price=Number(document.getElementById("price").value);
    let quantity=Number(document.getElementById("quantity").value);

    if(name=="" || price<=0 || quantity<=0){
        alert("Please enter valid details");
        return;
    }

    // Object
    let item={
        name:name,
        price:price,
        quantity:quantity
    };

    cart.push(item);

    displayCart();

    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("quantity").value="";
}

function displayCart(){

    let body=document.getElementById("cartBody");
    body.innerHTML="";

    // forEach()
    cart.forEach(function(item){

        body.innerHTML+=`
        <tr>
        <td>${item.name}</td>
        <td>${item.price}</td>
        <td>${item.quantity}</td>
        <td>${item.price*item.quantity}</td>
        </tr>
        `;

    });

    // reduce()
    let totalPrice=cart.reduce(function(sum,item){
        return sum+(item.price*item.quantity);
    },0);

    let totalQty=cart.reduce(function(sum,item){
        return sum+item.quantity;
    },0);

    // Discount Logic
    let discount=0;

    if(totalPrice>=5000){
        discount=totalPrice*0.20;
    }
    else if(totalPrice>=3000){
        discount=totalPrice*0.15;
    }
    else if(totalPrice>=1000){
        discount=totalPrice*0.10;
    }

    let finalAmount=totalPrice-discount;

    // map()
    let products=cart.map(function(item){
        return item.name;
    });

    console.log("Products:",products);

    document.getElementById("qty").innerHTML=totalQty;
    document.getElementById("total").innerHTML=totalPrice;
    document.getElementById("discount").innerHTML=discount;
    document.getElementById("final").innerHTML=finalAmount;
}

</script>

</body>
</html>
